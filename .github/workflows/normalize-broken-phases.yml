name: Normalize broken phases

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-broken-phases.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild phases 1, 4 and 5 as plain HTML
        shell: python
        run: |
          import base64, gzip, pathlib

          root = pathlib.Path('.')

          def from_fixed(prefix):
              b64 = (root / 'payload' / f'{prefix}-fixed.txt').read_text(encoding='utf-8').strip()
              return gzip.decompress(base64.b64decode(b64)).decode('utf-8')

          checks = [
              ('fase1.html', from_fixed('f1'), 'Fase 1', 47728),
              ('fase4.html', from_fixed('f4'), 'Fase 4', 64508),
              ('fase5.html', from_fixed('f5'), 'Fase 5', 69908),
          ]

          for filename, html, label, expected in checks:
              raw = html.encode('utf-8')
              low = html.lower()
              if len(raw) != expected:
                  raise SystemExit(f'{label} size mismatch: {len(raw)} != {expected}')
              if '<html' not in low or '</html>' not in low or '<body' not in low or '</body>' not in low:
                  raise SystemExit(f'{label} failed HTML integrity checks')
              (root / filename).write_text(html, encoding='utf-8')
              print(filename, len(raw), 'bytes OK')

      - name: Commit static HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fase1.html fase4.html fase5.html
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "Serve phases 1 4 5 as plain HTML"
          git push
