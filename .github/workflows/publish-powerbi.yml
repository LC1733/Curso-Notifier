name: Publish Power BI Learning Hub

on:
  push:
    paths:
      - '.github/workflows/publish-powerbi.yml'
      - 'payload/powerbi-final-v5.patch'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-powerbi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply and verify final Power BI patch
        shell: bash
        run: |
          set -euo pipefail
          OLD_SHA='760663c50f0d2a7137bbe5c731da7048bf898fa58b4b8d1df485a03eba3e5f01'
          NEW_SHA='ab5e85ae37104ac91d704810622c66a031039296132f51f50c46e74088ae1394'
          CURRENT_SHA="$(sha256sum powerbi-learning-hub.html | awk '{print $1}')"

          if [ "$CURRENT_SHA" = "$NEW_SHA" ]; then
            echo 'Final Power BI file already verified.'
            exit 0
          fi

          if [ "$CURRENT_SHA" != "$OLD_SHA" ]; then
            echo "Unexpected starting SHA: $CURRENT_SHA" >&2
            exit 1
          fi

          git apply --check payload/powerbi-final-v5.patch
          git apply payload/powerbi-final-v5.patch
          test "$(wc -c < powerbi-learning-hub.html)" -eq 172049
          echo "$NEW_SHA  powerbi-learning-hub.html" | sha256sum -c -

      - name: Commit final Power BI course
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add powerbi-learning-hub.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Publish final Power BI Learning Hub'
          git push
